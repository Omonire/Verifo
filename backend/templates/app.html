{% extends "base.html" %}
{% block body %}
<meta name="local-js" content="{{ '1' if config.LOCAL_JS else '0' }}">
<nav class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="/dashboard">
      <span class="brand-mark"><span class="material-symbols-outlined">verified</span></span>
      Verifo
    </a>
    <div class="topbar-nav" id="app-nav">
      <a href="/dashboard" class="{% if section == 'dashboard' %}on{% endif %}">Dashboard</a>
      <a href="/verify" class="{% if section == 'verify' %}on{% endif %}" id="nav-verify">Verify</a>
      <a href="/my-results" class="{% if section == 'my-results' %}on{% endif %}" id="nav-my-results" style="display:none">My Results</a>
      <a href="/screening" class="{% if section == 'screening' %}on{% endif %}" data-staff>Screening</a>
      <a href="/references" class="{% if section == 'references' %}on{% endif %}" data-staff>References</a>
      <a href="/settings" class="{% if section == 'settings' %}on{% endif %}" data-staff>Settings</a>
    </div>
    <div class="topbar-user">
      <div class="user-meta">
        <span class="n" id="user-name">…</span>
        <span class="o" id="user-org">…</span>
      </div>
      <span class="avatar" id="user-avatar">…</span>
      <button type="button" class="btn btn-ghost btn-sm" id="sign-out">Sign out</button>
    </div>
    <button type="button" class="topbar-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false">
      <span class="material-symbols-outlined">menu</span>
    </button>
  </div>
</nav>
<main class="container app-main">
  {% block app %}{% endblock %}
</main>
<script src="/static/js/common.js"></script>
<script>
  (function () {
    Verifo.bootstrap().then(function (me) {
      var role = Verifo.role();
      var nameEl = document.getElementById("user-name");
      var orgEl = document.getElementById("user-org");
      var avEl = document.getElementById("user-avatar");
      if (me && me.user) {
        var name = me.user.full_name || me.user.email || "User";
        nameEl.textContent = name;
        avEl.textContent = name.split(/\s+/).map(function (w) { return w[0]; }).slice(0, 2).join("").toUpperCase();
        var org = (me.user && me.user.organization && me.user.organization.name)
          || "Workspace";
        orgEl.textContent = org + (role ? " · " + role : "");
      }
      var isSubmitter = role === "SUBMITTER";
      var isStaff = role === "ADMIN" || role === "OPERATOR";

      // Show/hide My Results (for submitters and staff)
      var myResults = document.getElementById("nav-my-results");
      if (myResults) {
        myResults.style.display = (isSubmitter || isStaff) ? "" : "none";
      }

      // Show/hide staff items
      var staff = document.querySelectorAll("[data-staff]");
      for (var i = 0; i < staff.length; i++) {
        if (isStaff) {
          staff[i].style.display = "";
        } else {
          staff[i].parentNode.removeChild(staff[i]);
        }
      }

      // Rename Verify -> Upload for submitters only
      var v = document.getElementById("nav-verify");
      if (v && isSubmitter) v.textContent = "Upload";
    });
    document.getElementById("sign-out").addEventListener("click", function () {
      Verifo.signOut();
    });

    // Mobile nav: toggle the hamburger dropdown
    var navToggle = document.getElementById("nav-toggle");
    var appNav = document.getElementById("app-nav");
    if (navToggle && appNav) {
      navToggle.addEventListener("click", function () {
        var open = appNav.classList.toggle("open");
        navToggle.setAttribute("aria-expanded", open ? "true" : "false");
        navToggle.querySelector("span").textContent = open ? "close" : "menu";
      });
      appNav.addEventListener("click", function (e) {
        if (e.target.tagName === "A") {
          appNav.classList.remove("open");
          navToggle.setAttribute("aria-expanded", "false");
          navToggle.querySelector("span").textContent = "menu";
        }
      });
    }
  })();
</script>
{% block scripts %}{% endblock %}
{% endblock %}
