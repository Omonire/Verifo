<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.site_name }}{% endblock %}</title>
  <script>document.documentElement.classList.add("js");</script>
  <style>
    /* Inline critical-path splash: paints before any external asset resolves. */
    .splash { position: fixed; inset: 0; z-index: 60; display: none; overflow: hidden;
      align-items: center; justify-content: center; background: #fff; }
    html.js .splash { display: flex; }
    .splash-bg { position: absolute; inset: -40%; background: radial-gradient(42% 42% at 22% 18%, #ede9fe 0, transparent 100%),
      radial-gradient(38% 38% at 82% 30%, #f5f3ff 0, transparent 100%),
      radial-gradient(46% 46% at 50% 95%, #ddd6fe 0, transparent 100%);
      animation: splash-drift 14s ease-in-out infinite alternate; }
    .splash-box { position: relative; display: flex; flex-direction: column; align-items: center;
      gap: 1rem; padding: 1.25rem; text-align: center; }
    .splash-mark { width: 4.75rem; height: 4.75rem; border-radius: 1.375rem; display: grid;
      place-items: center; background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      box-shadow: 0 18px 40px -12px rgba(124, 58, 237, 0.55); animation: splash-pop 0.5s ease both; }
    .splash-mark::before { content: ""; width: 1.625rem; height: 0.875rem;
      border-left: 3.5px solid #fff; border-bottom: 3.5px solid #fff;
      transform: rotate(-45deg) translate(2px, -2px); }
    .splash-name { font: 800 1.5rem/1 "Plus Jakarta Sans", system-ui, sans-serif; color: #111827;
      letter-spacing: -0.03em; animation: splash-rise 0.55s 0.08s ease both; }
    .splash-name em { font-style: normal; color: #7c3aed; }
    .splash-tag { font: 500 0.8125rem/1.4 "Plus Jakarta Sans", system-ui, sans-serif; color: #6b7280;
      max-width: 17rem; animation: splash-rise 0.55s 0.16s ease both; }
    .splash-track { width: min(16rem, 72vw); height: 0.3125rem; border-radius: 9999px;
      background: #ede9fe; overflow: hidden; animation: splash-rise 0.55s 0.24s ease both; }
    .splash-track::before { content: ""; display: block; height: 100%; width: 40%;
      border-radius: 9999px; background: linear-gradient(90deg, #8b5cf6, #6d28d9);
      animation: splash-bar 1.1s 0.35s ease-in-out infinite alternate; }
    @keyframes splash-drift { from { transform: translate3d(-2%, 0, 0) rotate(-2deg); } to { transform: translate3d(2%, 1.5%, 0) rotate(2deg); } }
    @keyframes splash-pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes splash-rise { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes splash-bar { from { transform: translateX(-10%); } to { transform: translateX(150%); } }
    html.js .splash-hide { opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
    @media (prefers-reduced-motion: reduce) {
      .splash-bg, .splash-mark, .splash-name, .splash-tag, .splash-track, .splash-track::before { animation: none !important; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
{% if site.announcement %}<div class="announcement">{{ site.announcement }}</div>{% endif %}
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-bg"></div>
  <div class="splash-box">
    <div class="splash-mark"></div>
    <div class="splash-name">{% if "Veri" in site.site_name %}Veri<em>{{ site.site_name[4:] }}</em>{% else %}{{ site.site_name }}{% endif %}</div>
    <div class="splash-tag">{{ site.tagline }}</div>
    <div class="splash-track"></div>
  </div>
</div>
{% block body %}{% endblock %}
<script>
  (function () {
    var s = document.getElementById("splash");
    if (!s) return;
    var done = false;
    function hide() {
      if (done) return;
      done = true;
      s.classList.add("splash-hide");
      setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 400);
    }
    // Assets (CSS, webfonts, images) finished — reveal. If they never finish, never trap the user.
    window.addEventListener("load", hide);
    setTimeout(hide, 4000);
    window.addEventListener("pageshow", function (e) { if (e.persisted) hide(); });
  })();
</script>
</body>
</html>
