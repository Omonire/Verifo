<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Verifo{% endblock %}</title>
  <script>document.documentElement.classList.add("js");</script>
  <style>
    /* Inline critical-path splash: paints before any external asset resolves. */
    .splash { position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.75rem; background: #fff; }
    html.js .splash { display: flex; }
    .splash-mark { width: 3.75rem; height: 3.75rem; border-radius: 14px;
      background: #7c3aed; display: grid; place-items: center; }
    .splash-mark::before { content: ""; width: 1.375rem; height: 0.7rem;
      border-left: 3px solid #fff; border-bottom: 3px solid #fff;
      transform: rotate(-45deg) translate(2px, -2px); }
    .splash-name { font: 800 1.25rem/1 "Plus Jakarta Sans", system-ui, sans-serif;
      color: #111827; letter-spacing: -0.02em; }
    .splash-spinner { width: 1.5rem; height: 1.5rem; border-radius: 9999px;
      border: 2px solid #ede9fe; border-top-color: #7c3aed; animation: splash-spin 0.8s linear infinite; }
    .splash-tag { font: 500 0.75rem/1 "Plus Jakarta Sans", system-ui, sans-serif; color: #6b7280; }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    html.js .splash-hide { opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-mark"></div>
  <div class="splash-name">Verifo</div>
  <div class="splash-spinner"></div>
  <div class="splash-tag">Loading…</div>
</div>
{% block body %}{% endblock %}
<script>
  (function () {
    var s = document.getElementById("splash");
    if (!s) return;
    var done = false;
    function hide() {
      if (done) return;
      done = true;
      s.classList.add("splash-hide");
      setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 400);
    }
    // Assets (CSS, webfonts, images) finished — reveal. If they never finish, never trap the user.
    window.addEventListener("load", hide);
    setTimeout(hide, 4000);
    window.addEventListener("pageshow", function (e) { if (e.persisted) hide(); });
  })();
</script>
</body>
</html>
